<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="85" viewBox="0 0 1000 85" fill="none">
  <!-- Background with subtle manga panel tone -->
  <rect width="1000" height="85" rx="10" fill="#0d1117"/>
  
  <!-- Outer sketch border -->
  <rect x="3" y="3" width="994" height="79" rx="8" stroke="#30363d" stroke-width="1.5" stroke-dasharray="10 5"/>
  
  <!-- Inner fine manga ink line -->
  <rect x="7" y="7" width="986" height="71" rx="6" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2"/>
  
  <!-- Left accent ink block -->
  <rect x="18" y="22" width="5" height="41" rx="2" fill="#ffffff"/>
  
  <!-- Main Title (English Manga Font) -->
  <text x="36" y="51" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="3">ABOUT ME</text>
  
  <!-- Subtitle (Japanese Kanji) -->
  <text x="177" y="50" fill="#8b949e" font-family="'Noto Serif JP', 'Hiragino Mincho Pro', 'Yu Mincho', serif" font-size="16" font-weight="600" letter-spacing="3">// 自己紹介</text>
  
  <!-- Katana / Manga speed slash lines on the right -->
  <line x1="780" y1="42" x2="960" y2="42" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="15 5 5 5"/>
  <polygon points="965,39 973,42 965,45" fill="#ffffff" fill-opacity="0.5"/>
</svg>